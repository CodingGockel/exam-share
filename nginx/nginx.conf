# Reverse proxy: the only container reachable from outside.
#   /api/ -> backend (Spring Boot, context path /api)
#   /     -> frontend (static files)

server {
    listen 80;
    server_name _;
    server_tokens off;

    # The app limit is 10 MB (pruefprot.upload.max-size). The proxy allows a bit more because
    # multipart encoding adds overhead, so the limit is enforced by the app and not here.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
