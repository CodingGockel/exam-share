# Development: only PostgreSQL with an open port. Credentials match backend/src/main/resources/application.yml.
#   docker compose -f docker-compose.dev.yml up -d
name: pruefprot-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pruefprot
      POSTGRES_USER: pruefprot
      POSTGRES_PASSWORD: pruefprot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pruefprot -d pruefprot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-dev-data:
